[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khata-backend"
version = "0.1.0"
description = "Personal budget + expense tracker (single user)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.dao", "app.services", "app.api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
